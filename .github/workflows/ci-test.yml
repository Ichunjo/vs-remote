name: Tests

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "tests/**"
      - "**/pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "**/pyproject.toml"
      - ".github/workflows/ci-test.yml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15", "3.15t"]
        runner: ["ubuntu-latest", "windows-latest", "macos-latest"]

    name: Test ${{ matrix.runner }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}

    env:
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
