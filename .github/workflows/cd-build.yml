name: Build
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      os:
        required: true
        type: string
      dist:
        description: "sdist or wheel"
        required: true
        type: string
      pure-python:
        required: false
        type: boolean
        default: false

jobs:
  wheels:
    name: Build wheel (${{ inputs.os }})
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
          python-version: ${{ inputs.python-version }}

      - name: Build ${{ inputs.dist }}
        env:
          VSREMOTE_BUILD_PURE_PYTHON: ${{ inputs.pure-python && '1' || '' }}
        run: uv build --${{ inputs.dist }}

      - name: Upload ${{ inputs.dist }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.dist }}
          path: dist/${{ '*.tar.gz' && inputs.dist == 'sdist' || '*.whl' }}
