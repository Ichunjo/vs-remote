name: Build
on:
  workflow_call:
    inputs:
      python-versions:
        required: false
        type: string
        default: '["3.12", "3.15t"]'
      os:
        required: true
        type: string
      dist:
        description: "sdist or wheel"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ inputs.dist }} (${{ inputs.os }} - ${{ matrix.python-version }})
    runs-on: ${{ inputs.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}

      - name: Build ${{ inputs.dist }}
        run: uv build --${{ inputs.dist }}

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux' && inputs.dist == 'wheel'
        run: |
          uvx --with patchelf auditwheel repair --strip dist/*.whl -w repaired_wheels
          rm dist/*.whl
          mv repaired_wheels/*.whl dist/

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS' && inputs.dist == 'wheel'
        run: |
          uvx --from delocate delocate-wheel -v dist/*.whl -w repaired_wheels
          rm dist/*.whl
          mv repaired_wheels/*.whl dist/
          uvx --from delocate delocate-listdeps dist/*.whl

      - name: Upload ${{ inputs.dist }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ inputs.dist }}-${{ inputs.os }}-${{ matrix.python-version }}
          path: dist/${{ inputs.dist == 'sdist' && '*.tar.gz' || '*.whl' }}
