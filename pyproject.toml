[build-system]
requires = [
    "hatchling>=1.32.0",
    "hatch-rs>=0.4.2",
    "uv-dynamic-versioning>=0.14.0",
]
build-backend = "hatchling.build"

[project]
name = "vsremote"
description = "Remote execution and frame proxy for VapourSynth"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Vardë", email = "ichunjo.le.terrible@gmail.com" }]
requires-python = ">=3.12"
keywords = ["video", "video-processing", "encoding", "server", "vapoursynth"]
classifiers = [
    "Topic :: Multimedia :: Graphics",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Typing :: Typed",
]
dependencies = [
    "vapoursynth>=79",
    "vsjetengine>=2.0.0",
    "pyzmq>=27.1.0",
    "backports.zstd>=1.8.0 ; python_version<='3.13'",
    "msgspec>=0.21.1",
    "cyclopts>=5.2.0",
    "rich>=15.0.0",
    "psutil>=7.0.0",
]
dynamic = ["version"]

[project.scripts]
vsremote = "vsremote.cli:main"

[project.urls]
"Source Code" = "https://github.com/Ichunjo/vs-remote"

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pyrefly~=1.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff~=0.17.0",
    "types-psutil>=7.0.0",
    "vsstubs>=3.0.0",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/vsremote"]
artifacts = ["src/vsremote/_copy_plane.*.*"]

[tool.hatch.build.hooks.hatch-rs]
verbose = true
abi3 = true
path = "."
module = "vsremote"
target-dir = "target"

[[tool.hatch.build.hooks.hatch-rs.artifacts]]
name = "_copy_plane"
manifest = "src/_copy_plane/Cargo.toml"
destination = "src/vsremote/{python_extension_name}"
editable-debug = false

[tool.uv-dynamic-versioning]
bump = true

[tool.pytest]
testpaths = ["tests"]

[tool.coverage.run]
disable_warnings = ["couldnt-parse"]
source = ["src"]
omit = ["tests/**", "./*.py"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "ASYNC",
    "C4",
    "LOG",
    "G",
    "PYI",
    "PT",
    "PTH",
    "RSE",
    "RET",
    "SIM",
    "ICN",
    "ISC",
    "N",
    "NPY",
    "PERF",
    "E",
    "ERA",
    "EXE",
    "UP",
    "FURB",
    "RUF",
]
ignore = ["B009", "B010"]

[tool.ruff.lint.per-file-ignores]
"__init__.*" = ["F401", "F403"]

[tool.pyrefly]
project-excludes = ["stubs"]
search-path = ["stubs", "tests"]
preset = "strict"
min-severity = "info"

[tool.pyrefly.errors]
redundant-cast = "error"
implicit-any-lambda = "ignore"
no-any-return = "error"
no-any-return-explicit = "ignore"
