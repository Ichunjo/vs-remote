[build-system]
requires = [
    "hatchling>=1.32.0",
    "mypy~=2.3.0",
    "setuptools>=84.0.0",
    "uv-dynamic-versioning>=0.14.0",
]
build-backend = "hatchling.build"

[project]
name = "vsremote"
description = "Remote execution and frame proxy for VapourSynth"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Vardë", email = "ichunjo.le.terrible@gmail.com" }]
requires-python = ">=3.12"
keywords = ["video", "video-processing", "encoding", "server", "vapoursynth"]
classifiers = [
    "Topic :: Multimedia :: Graphics",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "vapoursynth>=79",
    "vsjetengine>=1.7.0",
    "pyzmq>=27.1.0",
    "zstandard>=0.25.0",
    "msgspec>=0.21.1",
    "cyclopts>=4.23.3",
    "rich>=15.0.0",
]
dynamic = ["version"]

[project.scripts]
vsremote = "vsremote.cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "mypy~=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff~=0.16.0",
    "setuptools>=84.0.0",
    "types-mypy-extensions>=1.1.0.20260724",
    "types-setuptools>=84.0.0.20260812",
    "vsstubs>=2.3.0",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/vsremote"]
artifacts = ["src/vsremote/_strides.*.*"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv-dynamic-versioning]
bump = true

[tool.pytest]
testpaths = ["tests"]

[tool.coverage.run]
disable_warnings = ["couldnt-parse"]
source = ["src"]
omit = ["tests/**", "./*.py"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "YTT",
    "ASYNC",
    "C4",
    "LOG",
    "G",
    "PIE",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SIM",
    "I",
    "N",
    "PERF",
    "E",
    "W",
    "UP",
    "FURB",
    "RUF",
]
ignore = ["N802", "N815", "B009", "B010", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"__init__.*" = ["F401", "F403"]

[tool.mypy]
mypy_path = "stubs"

# Flags changed by --strict
warn_return_any = false
extra_checks = false

# Misc
warn_unreachable = true

enable_error_code = ["explicit-override"]
allow_redefinition_new = true
local_partial_types = true
implicit_reexport = false
strict = true

show_column_numbers = true
pretty = true
color_output = true

[[tool.mypy.overrides]]
module = ["vapoursynth", "vapoursynth.*"]
ignore_errors = true
